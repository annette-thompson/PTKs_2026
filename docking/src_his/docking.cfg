# HADDOCK3 docking, Geng et al. 2017 settings; written by workflows/Prep/docking_inputs.py
run_dir = "run"
mode = "local"
ncores = 64
molecules = ["receptor.pdb", "peptide_ensemble.pdb"]

[topoaa]
autohis = false
[topoaa.mol1]
charged_nter = true
charged_cter = true
nhise = 2
hise_1 = 319
hise_2 = 384
[topoaa.mol2]
charged_nter = true
charged_cter = true
nhise = 1
hise_1 = 5

[rigidbody]
ambig_fname = "ambig.tbl"
unambig_fname = "unambig.tbl"
hbond_fname = "hbond.tbl"
sampling = 26000

[caprieval]

[seletop]
select = 400

[flexref]
ambig_fname = "ambig.tbl"
unambig_fname = "unambig.tbl"
hbond_fname = "hbond.tbl"
unambig_hot = 1000
unambig_cool1 = 1000
unambig_cool2 = 1000
unambig_cool3 = 1000
fle_sta_1 = 1
fle_end_1 = 11
fle_seg_1 = "B"
mdsteps_rigid = 2000
mdsteps_cool1 = 2000
mdsteps_cool2 = 4000
mdsteps_cool3 = 4000

[caprieval]

[mdref]
ambig_fname = "ambig.tbl"
unambig_fname = "unambig.tbl"
hbond_fname = "hbond.tbl"
unambig_scale = 1000
fle_sta_1 = 1
fle_end_1 = 11
fle_seg_1 = "B"

[caprieval]

[ilrmsdmatrix]
receptor_chain = "A"
ligand_chains = ["B"]

[clustrmsd]
criterion = "distance"
clust_cutoff = 5.0

[seletopclusts]
top_models = 4

[caprieval]

